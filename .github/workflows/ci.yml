name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Download real Corretto JDKs and test Shell activation
        type: boolean
        default: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Unix shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - name: Verify global package installation
        shell: bash
        run: |
          PACKAGE_TARBALL="$(npm pack --silent)"
          npm install --global --prefix "$RUNNER_TEMP/nova-package" "./$PACKAGE_TARBALL"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/nova-package/nova.cmd" --version
          else
            "$RUNNER_TEMP/nova-package/bin/nova" --version
          fi
      - name: Real Corretto smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOVA_SMOKE_VERSIONS: 17,21
        run: npm run smoke
